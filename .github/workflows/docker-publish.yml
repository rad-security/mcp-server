name: Publish Docker image to ECR

# Builds the container image and pushes it to the private ECR repo
# 148370413014.dkr.ecr.us-east-1.amazonaws.com/rad-security/mcp-server.
#
# Auth mirrors rad-security/rad's backend workflow (amazon-ecr-login@v2 with the
# AWS_GITHUB_RUNNER_* keys of github_actions_iam_user, which the repo policy
# grants push). Unlike that Go service we build the Dockerfile with buildx
# instead of `ko`.
#
# Tags:
#   - sha-<short>  on every build (immutable reference for GitOps pinning)
#   - <version>    additionally on v* tag pushes (e.g. v0.1.0 -> 0.1.0)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE: 148370413014.dkr.ecr.us-east-1.amazonaws.com/rad-security/mcp-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` can resolve the version

      - name: Resolve version
        id: version
        run: |
          echo "value=$(git describe --always --tags | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          # The sha- tag is pushed on every build, so it's a stable handle for
          # the scan step regardless of whether this run is a branch or a tag.
          echo "scan_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_RUNNER_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_RUNNER_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the image we just pushed with RAD Security (dogfooding the same
      # action plugin-ksoc-sbom uses). Fails the run on high/critical findings,
      # on a severity regression, or on end-of-life base images — so a bad image
      # is caught before anyone bumps the GitOps tag to it.
      - name: Scan image
        id: scan
        uses: rad-security/image-scan-action@v0.0.3
        env:
          RAD_ACCESS_KEY_ID: ${{ secrets.RAD_ACCESS_KEY_ID }}
          RAD_SECRET_KEY: ${{ secrets.RAD_SECRET_KEY }}
        with:
          image: ${{ env.IMAGE }}:${{ steps.version.outputs.scan_tag }}
          fail_on_severity: high
          rad_account_ids: 2IAtTppYqpVGxSdkBWW5n7zYzVU
          rad_fail_on_regression: high
          rad_fail_on_eol: "true"

      - name: Upload RAD report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: rad-report
          path: ${{ steps.scan.outputs.rad_report }}
